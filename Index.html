<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --utama:#1E5AA8; --gelap:#164a8c; --pekat:#0f3568;
    --tinta:#16202e; --abu:#65718a; --garis:#dde3ec; --kertas:#f4f6fa; --putih:#fff;
    --hijau:#0e7a55; --hijau-bg:#e2f4ec; --merah:#b3261e; --merah-bg:#fbeae8;
    --kuning:#8a5a00; --kuning-bg:#fdf3dd; --abu-bg:#eceff4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--kertas);
       color:var(--tinta);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .bungkus{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ---------- kepala ---------- */
  .kepala{background:var(--pekat);color:#fff;padding:26px 0 22px}
  .kepala h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .kepala p{font-size:13px;color:#a9bcd8;margin-top:4px}
  .tab{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap}
  .tab button{background:rgba(255,255,255,.10);color:#c5d4e8;border:none;padding:9px 16px;
      border-radius:8px 8px 0 0;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .tab button.on{background:var(--kertas);color:var(--pekat)}

  /* ---------- panel alat ---------- */
  .alat{background:var(--putih);border:1px solid var(--garis);border-radius:0 12px 12px 12px;
        padding:16px;margin-top:0;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .kolom-alat{display:flex;flex-direction:column;gap:5px}
  .kolom-alat.tumbuh{flex:1;min-width:220px}
  label{font-size:11.5px;font-weight:600;color:var(--abu)}
  input,select{font:inherit;font-size:13.5px;padding:9px 11px;border:1.5px solid var(--garis);
      border-radius:8px;background:var(--putih);color:var(--tinta);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--utama);box-shadow:0 0 0 3px rgba(30,90,168,.13)}
  button.aksi{font:inherit;font-size:13.5px;font-weight:600;padding:9px 15px;border:1.5px solid var(--garis);
      background:var(--putih);color:var(--utama);border-radius:8px;cursor:pointer}
  button.aksi:hover{border-color:var(--utama)}
  button.aksi.utama{background:var(--utama);color:#fff;border-color:var(--utama)}
  button.aksi.utama:hover{background:var(--gelap)}
  button.aksi:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- tabel ---------- */
  .kotak{background:var(--putih);border:1px solid var(--garis);border-radius:12px;margin-top:14px;overflow:hidden}
  .gulir{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;background:#f7f9fc;color:var(--abu);font-size:11.5px;font-weight:700;
     text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;border-bottom:1px solid var(--garis);
     white-space:nowrap;position:sticky;top:0}
  th.bisa{cursor:pointer;user-select:none}
  th.bisa:hover{color:var(--utama)}
  th .arah{opacity:.45;margin-left:4px;font-size:10px}
  th.aktif{color:var(--utama)}
  th.aktif .arah{opacity:1}
  td{padding:11px 14px;border-bottom:1px solid #eef1f6;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f9fbfe;cursor:pointer}
  td.angka{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .lencana{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .l-hijau{background:var(--hijau-bg);color:var(--hijau)}
  .l-merah{background:var(--merah-bg);color:var(--merah)}
  .l-kuning{background:var(--kuning-bg);color:var(--kuning)}
  .l-abu{background:var(--abu-bg);color:var(--abu)}
  .l-biru{background:#e6eefa;color:var(--utama)}
  a.tautan{color:var(--utama);font-weight:600;text-decoration:none}
  a.tautan:hover{text-decoration:underline}

  /* ---------- kartu ---------- */
  .kartu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;padding:14px}
  .kartu{border:1px solid var(--garis);border-radius:11px;padding:14px;background:var(--putih);
         cursor:pointer;transition:.15s}
  .kartu:hover{border-color:var(--utama);box-shadow:0 4px 14px rgba(22,32,46,.08)}
  .kartu .jd{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .kartu .sj{font-size:13px;color:var(--abu);margin-top:2px}
  .kartu .br{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;
             border-top:1px solid #f1f4f8;margin-top:8px;padding-top:8px}
  .kartu .br span:first-child{color:var(--abu)}
  .kartu .br span:last-child{font-weight:600;text-align:right}

  /* ---------- kaki tabel ---------- */
  .kaki{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;
        border-top:1px solid var(--garis);background:#fbfcfe;flex-wrap:wrap}
  .cacah{font-size:12.5px;color:var(--abu)}
  .halaman{display:flex;gap:5px;align-items:center}
  .halaman button{min-width:34px;padding:6px 9px;font-size:13px;border:1.5px solid var(--garis);
      background:var(--putih);border-radius:7px;cursor:pointer;font:inherit;color:var(--tinta)}
  .halaman button.on{background:var(--utama);color:#fff;border-color:var(--utama);font-weight:700}
  .halaman button:disabled{opacity:.4;cursor:not-allowed}

  /* ---------- keadaan ---------- */
  .keadaan{padding:46px 20px;text-align:center;color:var(--abu);font-size:13.5px}
  .keadaan .ic{font-size:30px;margin-bottom:8px;opacity:.5}
  .spin{display:inline-block;width:17px;height:17px;border:2.5px solid #dbe3ee;
        border-top-color:var(--utama);border-radius:50%;animation:putar .7s linear infinite}
  @keyframes putar{to{transform:rotate(360deg)}}
  .galat{background:var(--merah-bg);border:1px solid #f2cfcb;color:var(--merah);
         border-radius:10px;padding:13px 15px;font-size:13px;margin-top:14px}
  .galat b{display:block;margin-bottom:3px}

  /* ---------- panel samping ---------- */
  .tirai{position:fixed;inset:0;background:rgba(15,30,55,.42);opacity:0;pointer-events:none;
         transition:.2s;z-index:40}
  .tirai.on{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--putih);
         z-index:41;transform:translateX(100%);transition:.25s cubic-bezier(.2,.8,.3,1);
         display:flex;flex-direction:column;box-shadow:-8px 0 34px rgba(15,30,55,.22)}
  .panel.on{transform:none}
  .panel-kepala{background:var(--pekat);color:#fff;padding:18px 20px;display:flex;
                justify-content:space-between;align-items:flex-start;gap:12px}
  .panel-kepala h2{font-size:16px;font-weight:700;line-height:1.3}
  .panel-kepala p{font-size:12.5px;color:#a9bcd8;margin-top:2px}
  .panel-tutup{background:rgba(255,255,255,.16);border:none;color:#fff;width:28px;height:28px;
               border-radius:50%;cursor:pointer;font-size:16px;line-height:1;flex:none}
  .panel-isi{flex:1;overflow-y:auto;padding:18px 20px}
  .panel-kaki{border-top:1px solid var(--garis);padding:14px 20px;background:#fbfcfe}
  .rinci{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #f1f4f8;font-size:13px}
  .rinci:last-child{border-bottom:none}
  .rinci .k{color:var(--abu);flex:none}
  .rinci .v{font-weight:600;text-align:right;overflow-wrap:anywhere}
  .pisah{margin:18px 0 12px;font-size:12px;font-weight:700;color:var(--abu);
         text-transform:uppercase;letter-spacing:.05em}
  .fg{margin-bottom:12px}
  .fg .bantu{font-size:11.5px;color:var(--abu);margin-top:3px}
  .wajib{color:var(--merah)}
  textarea{font:inherit;font-size:13.5px;padding:9px 11px;border:1.5px solid var(--garis);
      border-radius:8px;width:100%;min-height:74px;resize:vertical;color:var(--tinta)}
  textarea:focus{outline:none;border-color:var(--utama);box-shadow:0 0 0 3px rgba(30,90,168,.13)}
  .pesan{border-radius:9px;padding:11px 13px;font-size:13px;margin-bottom:13px}
  .p-salah{background:var(--merah-bg);color:var(--merah);border:1px solid #f2cfcb}
  .p-benar{background:var(--hijau-bg);color:var(--hijau);border:1px solid #b9e2d0}
  .tiket{font-family:ui-monospace,monospace;font-size:15px;font-weight:600;background:var(--kertas);
         border:1.5px dashed var(--utama);border-radius:9px;padding:11px;text-align:center;margin:11px 0}
  .sembunyi{display:none!important}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="kepala">
  <div class="bungkus">
    <h1 id="judulApl">Portal Data</h1>
    <p id="subJudul"></p>
    <div class="tab" id="tabDataset"></div>
  </div>
</div>

<div class="bungkus">
  <div class="alat" id="alat">
    <div class="kolom-alat tumbuh">
      <label for="cari">Pencarian</label>
      <input type="text" id="cari" placeholder="Ketik untuk mencari..." autocomplete="off">
    </div>
    <div id="wadahSaring" style="display:contents"></div>
    <div class="kolom-alat">
      <label for="perHalaman">Baris</label>
      <select id="perHalaman"></select>
    </div>
    <div class="kolom-alat">
      <label>&nbsp;</label>
      <button class="aksi" id="tblSegar">Muat ulang</button>
    </div>
  </div>

  <div id="wadahGalat"></div>

  <div class="kotak">
    <div id="isi"><div class="keadaan"><span class="spin"></span><div style="margin-top:9px">Memuat data...</div></div></div>
    <div class="kaki sembunyi" id="kaki">
      <span class="cacah" id="cacah"></span>
      <div class="halaman" id="halaman"></div>
    </div>
  </div>
  <div style="height:32px"></div>
</div>

<div class="tirai" id="tirai"></div>
<aside class="panel" id="panel">
  <div class="panel-kepala">
    <div><h2 id="panelJudul"></h2><p id="panelSub"></p></div>
    <button class="panel-tutup" id="panelTutup">&times;</button>
  </div>
  <div class="panel-isi" id="panelIsi"></div>
  <div class="panel-kaki sembunyi" id="panelKaki">
    <button class="aksi utama" id="tblKirim" style="width:100%">Kirim</button>
  </div>
</aside>

<script>
/* ============================================================
   Halaman ini tidak mengenal satu pun nomor kolom.
   Seluruh kolom, label, penyaring, dan formulir digambar dari
   skema yang dikirim Apps Script.

   Kalau halaman ini di-host sendiri (bukan disajikan Apps Script),
   isi ENDPOINT dengan URL Web App. Kalau disajikan Apps Script,
   biarkan kosong — komunikasinya lewat google.script.run.
   ============================================================ */
const ENDPOINT = '';

const LEWAT_GS = (typeof google !== 'undefined' && google.script && google.script.run);

let AWAL = null, SKEMA = null, DATA = null, BARIS_AKTIF = null;
let KEADAAN = { dataset: '', cari: '', saring: {}, urut: { field: '', arah: 'naik' },
                halaman: 1, perHalaman: 25 };

const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- jembatan ke backend ---------- */
function panggil(namaFungsi, aksiHttp, argumen, muatan){
  return new Promise((selesai, gagal) => {
    if(LEWAT_GS){
      google.script.run.withSuccessHandler(selesai).withFailureHandler(e => gagal(new Error(e.message)))
        [namaFungsi](argumen === undefined ? muatan : argumen);
      return;
    }
    if(!ENDPOINT){ gagal(new Error('ENDPOINT belum diisi di berkas Index.html.')); return; }
    if(muatan){
      fetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                        body: JSON.stringify(Object.assign({ action: aksiHttp }, muatan)) })
        .then(r => r.json()).then(selesai).catch(gagal);
    } else {
      const q = new URLSearchParams(Object.assign({ action: aksiHttp }, argumen || {}));
      fetch(ENDPOINT + '?' + q.toString()).then(r => r.json()).then(selesai).catch(gagal);
    }
  });
}

const apiAwal   = ()      => panggil('apiDaftarDataset', 'dataset', {});
const apiSkema  = (ds)    => panggil('apiSkema', 'skema', { dataset: ds }, undefined);
const apiData   = (opsi)  => LEWAT_GS
  ? panggil('apiData', 'data', opsi)
  : panggil('apiData', 'data', {
      dataset: opsi.dataset, cari: opsi.cari, saring: JSON.stringify(opsi.saring || {}),
      urutField: (opsi.urut||{}).field || '', urutArah: (opsi.urut||{}).arah || '',
      halaman: opsi.halaman, perHalaman: opsi.perHalaman });
const apiTulis  = (kirim) => LEWAT_GS
  ? panggil('apiTulis', 'tulis', kirim)
  : panggil('apiTulis', 'tulis', undefined, kirim);

/* ---------- pemuatan awal ---------- */
async function mulai(){
  try{
    AWAL = await apiAwal();
    if(!AWAL || !AWAL.ok) throw new Error((AWAL && AWAL.pesan) || 'Konfigurasi tidak terbaca.');

    const w = AWAL.warna || {};
    const akar = document.documentElement.style;
    if(w.utama) akar.setProperty('--utama', w.utama);
    if(w.gelap) akar.setProperty('--gelap', w.gelap);
    if(w.pekat) akar.setProperty('--pekat', w.pekat);

    el('judulApl').textContent = AWAL.judulAplikasi || 'Portal Data';
    el('subJudul').textContent = AWAL.subJudul || '';
    document.title = AWAL.judulAplikasi || 'Portal Data';

    gambarTab();
    await gantiDataset(AWAL.bawaan || (AWAL.dataset[0] && AWAL.dataset[0].kunci));
  }catch(e){ galat('Gagal memuat konfigurasi', e.message); }
}

function gambarTab(){
  const t = el('tabDataset');
  if(!AWAL.dataset || AWAL.dataset.length < 2){ t.innerHTML = ''; return; }
  t.innerHTML = AWAL.dataset.map(d =>
    '<button data-ds="' + esc(d.kunci) + '">' + esc(d.label) + '</button>').join('');
  t.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => gantiDataset(b.getAttribute('data-ds'))));
}

async function gantiDataset(kunci){
  KEADAAN = { dataset: kunci, cari: '', saring: {}, urut: { field:'', arah:'naik' },
              halaman: 1, perHalaman: 25 };
  el('cari').value = '';
  document.querySelectorAll('#tabDataset button').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-ds') === kunci));

  try{
    SKEMA = await apiSkema(kunci);
    if(!SKEMA || !SKEMA.ok) throw new Error((SKEMA && SKEMA.pesan) || 'Skema tidak terbaca.');
    const t = SKEMA.tampilan || {};
    KEADAAN.perHalaman = t.perHalaman || 25;
    KEADAAN.urut = { field: (t.urutBawaan||{}).field || '', arah: (t.urutBawaan||{}).arah || 'naik' };
    gambarAlat();
    await muatData();
  }catch(e){ galat('Gagal memuat skema dataset', e.message); }
}

function gambarAlat(){
  const s = el('wadahSaring');
  s.innerHTML = (SKEMA.penyaring || []).map((p, i) =>
    '<div class="kolom-alat"><label for="sr' + i + '">' + esc(p.label) + '</label>' +
    '<select id="sr' + i + '" data-f="' + esc(p.kunci) + '"><option value="">Semua</option>' +
    p.nilai.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join('') +
    '</select></div>').join('');
  s.querySelectorAll('select').forEach(sel => sel.addEventListener('change', () => {
    const f = sel.getAttribute('data-f');
    if(sel.value) KEADAAN.saring[f] = sel.value; else delete KEADAAN.saring[f];
    KEADAAN.halaman = 1; muatData();
  }));

  const pil = (SKEMA.tampilan && SKEMA.tampilan.pilihanPerHalaman) || [10,25,50,100];
  el('perHalaman').innerHTML = pil.map(n =>
    '<option value="' + n + '"' + (n === KEADAAN.perHalaman ? ' selected' : '') + '>' + n + '</option>').join('');
}

async function muatData(){
  el('isi').innerHTML = '<div class="keadaan"><span class="spin"></span>' +
    '<div style="margin-top:9px">Memuat data...</div></div>';
  el('kaki').classList.add('sembunyi');
  el('wadahGalat').innerHTML = '';
  try{
    DATA = await apiData(KEADAAN);
    if(!DATA || !DATA.ok) throw new Error((DATA && DATA.pesan) || 'Data tidak terbaca.');
    if((SKEMA.tampilan && SKEMA.tampilan.mode) === 'kartu') gambarKartu(); else gambarTabel();
    gambarKaki();
  }catch(e){
    el('isi').innerHTML = '<div class="keadaan"><div class="ic">&#9888;</div>Data tidak bisa dimuat.</div>';
    galat('Gagal memuat data', e.message);
  }
}

/* ---------- penggambaran ---------- */
function selNilai(b, k){
  const isi = b[k.kunci];
  if(isi === '' || isi === null || isi === undefined) return '<span style="color:#b6bfcd">—</span>';
  if(k.tipe === 'status'){
    const warna = (k.warna && k.warna[String(isi).toUpperCase()]) || 'biru';
    return '<span class="lencana l-' + esc(warna) + '">' + esc(isi) + '</span>';
  }
  if(k.tipe === 'tautan'){
    const u = String(isi);
    return /^https?:\/\//i.test(u)
      ? '<a class="tautan" href="' + esc(u) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">Buka</a>'
      : esc(u);
  }
  if(k.tipe === 'panjang'){
    const t = String(isi);
    return esc(t.length > 90 ? t.slice(0, 90) + '…' : t);
  }
  return esc(isi);
}

function gambarTabel(){
  const kol = SKEMA.kolom;
  if(!DATA.baris.length){ gambarKosong(); return; }
  let h = '<div class="gulir"><table><thead><tr>';
  kol.forEach(k => {
    const aktif = KEADAAN.urut.field === k.kunci;
    const panah = aktif ? (KEADAAN.urut.arah === 'turun' ? '▼' : '▲') : '↕';
    h += '<th' + (k.bolehUrut ? ' class="bisa' + (aktif ? ' aktif' : '') + '" data-f="' + esc(k.kunci) + '"' : '') +
         (k.lebar ? ' style="min-width:' + k.lebar + 'px"' : '') + '>' +
         esc(k.label) + (k.bolehUrut ? '<span class="arah">' + panah + '</span>' : '') + '</th>';
  });
  h += '</tr></thead><tbody>';
  DATA.baris.forEach((b, i) => {
    h += '<tr data-i="' + i + '">';
    kol.forEach(k => {
      const angka = (k.tipe === 'angka' || k.tipe === 'rupiah');
      h += '<td' + (angka ? ' class="angka"' : '') + '>' + selNilai(b, k) + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  el('isi').innerHTML = h;

  el('isi').querySelectorAll('th.bisa').forEach(th =>
    th.addEventListener('click', () => urutkan(th.getAttribute('data-f'))));
  el('isi').querySelectorAll('tbody tr').forEach(tr =>
    tr.addEventListener('click', () => bukaPanel(DATA.baris[Number(tr.getAttribute('data-i'))])));
}

function gambarKartu(){
  if(!DATA.baris.length){ gambarKosong(); return; }
  const t = SKEMA.tampilan || {};
  const kunciJudul = t.judulKartu, kunciSub = t.subJudulKartu;
  const sisa = SKEMA.kolom.filter(k => k.kunci !== kunciJudul && k.kunci !== kunciSub);
  let h = '<div class="kartu-grid">';
  DATA.baris.forEach((b, i) => {
    h += '<div class="kartu" data-i="' + i + '">' +
         '<div class="jd">' + esc(b[kunciJudul] || '—') + '</div>' +
         (kunciSub ? '<div class="sj">' + esc(b[kunciSub] || '') + '</div>' : '') +
         sisa.slice(0, 4).map(k =>
           '<div class="br"><span>' + esc(k.label) + '</span><span>' + selNilai(b, k) + '</span></div>').join('') +
         '</div>';
  });
  h += '</div>';
  el('isi').innerHTML = h;
  el('isi').querySelectorAll('.kartu').forEach(c =>
    c.addEventListener('click', () => bukaPanel(DATA.baris[Number(c.getAttribute('data-i'))])));
}

function gambarKosong(){
  const pesan = (SKEMA.tampilan && SKEMA.tampilan.pesanKosong) || 'Tidak ada data yang cocok.';
  el('isi').innerHTML = '<div class="keadaan"><div class="ic">&#128269;</div>' + esc(pesan) + '</div>';
}

function gambarKaki(){
  el('kaki').classList.remove('sembunyi');
  const mulai = DATA.total ? (DATA.halaman - 1) * DATA.perHalaman + 1 : 0;
  const akhir = Math.min(DATA.halaman * DATA.perHalaman, DATA.total);
  el('cacah').textContent = DATA.total
    ? 'Menampilkan ' + mulai + '–' + akhir + ' dari ' + DATA.total.toLocaleString('id-ID') + ' baris'
    : 'Tidak ada baris';

  const n = DATA.jumlahHalaman, k = DATA.halaman;
  let daftar = [];
  if(n <= 7){ for(let i=1;i<=n;i++) daftar.push(i); }
  else{
    daftar.push(1);
    if(k > 3) daftar.push('…');
    for(let i = Math.max(2, k-1); i <= Math.min(n-1, k+1); i++) daftar.push(i);
    if(k < n-2) daftar.push('…');
    daftar.push(n);
  }
  el('halaman').innerHTML =
    '<button ' + (k<=1?'disabled':'') + ' data-h="' + (k-1) + '">‹</button>' +
    daftar.map(x => x === '…'
      ? '<span style="color:#a9b3c3;padding:0 3px">…</span>'
      : '<button class="' + (x===k?'on':'') + '" data-h="' + x + '">' + x + '</button>').join('') +
    '<button ' + (k>=n?'disabled':'') + ' data-h="' + (k+1) + '">›</button>';
  el('halaman').querySelectorAll('button[data-h]').forEach(b =>
    b.addEventListener('click', () => {
      const h = Number(b.getAttribute('data-h'));
      if(h >= 1 && h <= n && h !== k){ KEADAAN.halaman = h; muatData(); window.scrollTo({top:0,behavior:'smooth'}); }
    }));
}

function urutkan(field){
  if(KEADAAN.urut.field === field){
    KEADAAN.urut.arah = KEADAAN.urut.arah === 'turun' ? 'naik' : 'turun';
  } else {
    KEADAAN.urut = { field: field, arah: 'naik' };
  }
  KEADAAN.halaman = 1;
  muatData();
}

function galat(judul, pesan){
  el('wadahGalat').innerHTML = '<div class="galat"><b>' + esc(judul) + '</b>' + esc(pesan) + '</div>';
}

/* ---------- panel rincian dan formulir ---------- */
function bukaPanel(baris){
  BARIS_AKTIF = baris;
  const t = SKEMA.tampilan || {};
  const kunciJudul = t.judulKartu || (SKEMA.kolom[0] && SKEMA.kolom[0].kunci);
  const kunciSub = t.subJudulKartu || '';
  el('panelJudul').textContent = baris[kunciJudul] || 'Rincian';
  el('panelSub').textContent = kunciSub ? (baris[kunciSub] || '') : '';

  let h = '';
  SKEMA.kolom.forEach(k => {
    if(k.kunci === kunciJudul || k.kunci === kunciSub) return;
    h += '<div class="rinci"><span class="k">' + esc(k.label) + '</span>' +
         '<span class="v">' + selNilai(baris, k) + '</span></div>';
  });

  const f = SKEMA.formulir;
  if(f && f.aktif && f.field.length){
    h += '<div class="pisah">Formulir</div><div id="pesanForm"></div>';
    f.field.forEach(x => {
      const isiAwal = x.ambilDariBaris ? (baris[x.ambilDariBaris] || '') : '';
      const wajib = x.wajib ? ' <span class="wajib">*</span>' : '';
      h += '<div class="fg"><label for="ff_' + esc(x.kunci) + '">' + esc(x.label) + wajib + '</label>';
      if(x.tipe === 'panjang'){
        h += '<textarea id="ff_' + esc(x.kunci) + '"></textarea>';
      } else {
        const jenis = x.tipe === 'email' ? 'email' : (x.tipe === 'telepon' ? 'tel'
                    : (x.tipe === 'angka' ? 'number' : (x.tipe === 'tanggal' ? 'date' : 'text')));
        h += '<input type="' + jenis + '" id="ff_' + esc(x.kunci) + '" value="' + esc(isiAwal) + '"' +
             (isiAwal && x.ambilDariBaris ? ' readonly style="background:#f7f9fc"' : '') + '>';
        if(isiAwal && x.ambilDariBaris) h += '<div class="bantu">Terisi dari baris yang Anda pilih.</div>';
      }
      h += '</div>';
    });
  }

  el('panelIsi').innerHTML = h;
  el('panelKaki').classList.toggle('sembunyi', !(f && f.aktif && f.field.length));
  el('tirai').classList.add('on');
  el('panel').classList.add('on');
}

function tutupPanel(){
  el('tirai').classList.remove('on');
  el('panel').classList.remove('on');
  BARIS_AKTIF = null;
}

async function kirimFormulir(){
  const f = SKEMA.formulir;
  const nilai = {};
  f.field.forEach(x => {
    const c = el('ff_' + x.kunci);
    if(c) nilai[x.kunci] = c.value.trim();
  });
  const kurang = f.field.filter(x => x.wajib && !nilai[x.kunci]);
  if(kurang.length){
    el('pesanForm').innerHTML = '<div class="pesan p-salah">Belum diisi: ' +
      esc(kurang.map(x => x.label).join(', ')) + '</div>';
    return;
  }

  const tbl = el('tblKirim');
  tbl.disabled = true; tbl.textContent = 'Mengirim...';
  el('pesanForm').innerHTML = '';

  const sumber = {};
  Object.keys(BARIS_AKTIF).forEach(k => {
    if(k.indexOf('_mentah_') === 0) sumber[k.replace('_mentah_','')] = BARIS_AKTIF[k];
  });

  try{
    const r = await apiTulis({ dataset: KEADAAN.dataset, nilai: nilai, barisSumber: sumber });
    if(!r || !r.ok) throw new Error((r && r.pesan) || 'Penyimpanan ditolak.');
    el('panelIsi').innerHTML =
      '<div class="pesan p-benar">' + esc(r.pesan) + '</div>' +
      '<div class="tiket">' + esc(r.id) + '</div>' +
      (r.kolomTerlewat && r.kolomTerlewat.length
        ? '<div class="pesan p-salah">Kolom berikut tidak ada di sheet target, isinya tidak tersimpan: ' +
          esc(r.kolomTerlewat.join(', ')) + '</div>' : '');
    el('panelKaki').classList.add('sembunyi');
  }catch(e){
    el('pesanForm').innerHTML = '<div class="pesan p-salah">' + esc(e.message) + '</div>';
    tbl.disabled = false; tbl.textContent = 'Kirim';
  }
}

/* ---------- pengikat ---------- */
let jeda = null;
el('cari').addEventListener('input', () => {
  clearTimeout(jeda);
  jeda = setTimeout(() => { KEADAAN.cari = el('cari').value.trim(); KEADAAN.halaman = 1; muatData(); }, 320);
});
el('perHalaman').addEventListener('change', () => {
  KEADAAN.perHalaman = Number(el('perHalaman').value); KEADAAN.halaman = 1; muatData();
});
el('tblSegar').addEventListener('click', () => {
  if(LEWAT_GS) google.script.run.withSuccessHandler(muatData).apiSegarkan();
  else muatData();
});
el('panelTutup').addEventListener('click', tutupPanel);
el('tirai').addEventListener('click', tutupPanel);
el('tblKirim').addEventListener('click', kirimFormulir);
document.addEventListener('keydown', e => { if(e.key === 'Escape') tutupPanel(); });

mulai();
</script>
</body>
</html>
